[workspace]
authors = ["kcajf <4301021+kcajf@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "wiktionary-apps"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
generate = "python -m pipeline.generate"
generate-dev = "python -m pipeline.generate --dev"
test = "pytest pipeline/tests/ -v"
pin-source-data = "python -m pipeline.pin_source_data"

[dependencies]
python = ">=3.14.2,<3.15"
requests = ">=2.32.5,<3"
brotli-python = ">=1.1.0,<2"
tqdm = ">=4.67.1,<5"
orjson = ">=3.11.5,<4"
msgspec = ">=0.20.0,<0.21"
polars = ">=1.37.1,<2"
rich = ">=14.2.0,<15"
pytest = ">=8,<9"

[pypi-dependencies]
wordfreq = ">=3,<4"
