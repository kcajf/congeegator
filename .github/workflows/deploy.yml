name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.46.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install rclone
        run: sudo apt-get install -y rclone

      # Configure rclone for R2 upload
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [r2-congeegator]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          no_check_bucket = true
          EOF

      # Generate data from pinned source (fetches via public R2 URL, no creds needed)
      - name: Generate data
        run: pixi run python data_processing.py --pinned

      # Upload data to R2 (needs rclone creds)
      - name: Upload data to R2
        run: npm run r2-upload:prod

      # Build and deploy
      - name: Build
        run: npm run build:prod

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
