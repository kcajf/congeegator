name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.46.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install rclone
        run: curl -sSf https://rclone.org/install.sh | sudo bash

      # Configure rclone for R2 upload
      - name: Configure rclone
        run: |
          rclone config create r2-congeegator s3 \
            provider Cloudflare \
            access_key_id "$R2_ACCESS_KEY_ID" \
            secret_access_key "$R2_SECRET_ACCESS_KEY" \
            endpoint "$R2_ENDPOINT" \
            acl private \
            no_check_bucket true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # Save old manifest hashes before regeneration
      - name: Save old manifest hashes
        run: |
          python3 -c "
          import json, sys
          with open('src/lib/data-manifest.json') as f:
              m = json.load(f)
          for lang, info in m.get('languages', {}).items():
              print(f\"{lang}={info['dataHash']}\")
          " > /tmp/old_hashes.txt
          cat /tmp/old_hashes.txt

      # Generate data from pinned source (fetches via public R2 URL, no creds needed)
      - name: Generate data
        run: pixi run python data_processing.py

      # Upload only changed language dirs to R2
      - name: Upload changed data to R2
        run: |
          BUCKET="r2-congeegator:congeegator"
          RCLONE_FLAGS="--transfers=64 --checkers=64 --fast-list --stats-one-line --checksum"

          # Build map of old hashes
          declare -A OLD_HASHES
          while IFS='=' read -r lang hash; do
            OLD_HASHES[$lang]=$hash
          done < /tmp/old_hashes.txt

          # Read new manifest and upload changed languages
          python3 -c "
          import json
          with open('src/lib/data-manifest.json') as f:
              m = json.load(f)
          for lang, info in m.get('languages', {}).items():
              print(f\"{lang}={info['dataHash']}\")
          " | while IFS='=' read -r lang hash; do
            dir="r2_data/data/v1/${lang}-${hash}"
            if [ "${OLD_HASHES[$lang]}" = "$hash" ]; then
              echo "Skipping $lang (hash unchanged: $hash)"
            else
              echo "Uploading $lang (hash changed: ${OLD_HASHES[$lang]:-new} -> $hash)"
              rclone copy "$dir" "$BUCKET/data/v1/${lang}-${hash}" $RCLONE_FLAGS
            fi
          done

      # Build and deploy
      - name: Build
        run: npm run build:prod

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
