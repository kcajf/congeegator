name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.46.0
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install rclone
        run: curl -fsS https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip && unzip -qj /tmp/rclone.zip '*/rclone' -d /usr/local/bin/

      - name: Configure rclone
        run: |
          rclone config create r2-congeegator s3 \
            provider Cloudflare \
            access_key_id "$R2_ACCESS_KEY_ID" \
            secret_access_key "$R2_SECRET_ACCESS_KEY" \
            endpoint "$R2_ENDPOINT" \
            acl private \
            no_check_bucket true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # Cache downloaded source data (keyed by SOURCE_DATA_VERSION in data_processing.py)
      - name: Get source data version
        id: source-version
        run: echo "version=$(grep -oP 'SOURCE_DATA_VERSION = "\K[^"]+' data_processing.py)" >> "$GITHUB_OUTPUT"

      - name: Cache source data
        uses: actions/cache@v4
        with:
          path: cache/
          key: source-data-${{ steps.source-version.outputs.version }}

      # Generate data from pinned source (fetches via public R2 URL, no creds needed)
      - name: Generate data
        run: pixi run python data_processing.py

      - name: Upload data to R2
        run: npm run r2-upload:prod

      # Build and deploy
      - name: Build
        run: npm run build:prod

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
