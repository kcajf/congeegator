name: Deploy
on:
  push:
    branches: [main]
    paths: ['apps/**', 'pipeline/**', 'pixi.toml', 'pixi.lock']
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.46.0
          cache: true

      - name: Install rclone
        run: curl -fsS https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip && unzip -qj /tmp/rclone.zip '*/rclone' -d /usr/local/bin/

      - name: Configure rclone
        run: |
          rclone config create r2-congeegator s3 \
            provider Cloudflare \
            access_key_id "$R2_ACCESS_KEY_ID" \
            secret_access_key "$R2_SECRET_ACCESS_KEY" \
            endpoint "$R2_ENDPOINT" \
            acl private \
            no_check_bucket true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: Cache source data
        uses: actions/cache@v4
        with:
          path: cache/
          key: source-data-${{ hashFiles('pipeline/cache.py') }}

      - name: Generate data
        run: pixi run generate

      - name: Upload congeegator data to R2
        run: |
          rclone copy apps/congeegator/r2_data r2-congeegator:congeegator \
            --transfers 512 --checkers 512 --s3-no-check-bucket \
            --fast-list --stats-one-line --stats=5s --size-only

      - name: Upload lexicoff data to R2
        run: |
          rclone copy apps/lexicoff/r2_data r2-congeegator:congeegator \
            --transfers 512 --checkers 512 --s3-no-check-bucket \
            --fast-list --stats-one-line --stats=5s --size-only

      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: data-manifests
          path: |
            apps/congeegator/src/lib/data-manifest.json
            apps/lexicoff/src/lib/data-manifest.json

  deploy-congeegator:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/congeegator/package-lock.json

      - name: Remove stale manifest
        run: rm apps/congeegator/src/lib/data-manifest.json

      - name: Download fresh manifest
        uses: actions/download-artifact@v4
        with:
          name: data-manifests
          path: apps

      - run: npm ci
        working-directory: apps/congeegator

      - name: Build
        run: npm run build:prod
        working-directory: apps/congeegator

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=production
        working-directory: apps/congeegator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-lexicoff:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lexicoff/package-lock.json

      - name: Remove stale manifest
        run: rm apps/lexicoff/src/lib/data-manifest.json

      - name: Download fresh manifest
        uses: actions/download-artifact@v4
        with:
          name: data-manifests
          path: apps

      - run: npm ci
        working-directory: apps/lexicoff

      - name: Build
        run: npm run build:prod
        working-directory: apps/lexicoff

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env=production
        working-directory: apps/lexicoff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
