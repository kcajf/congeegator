name: CI
on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build:staging
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.46.0
      - run: pixi run test
      - run: pixi run python data_processing.py --check-manifest-metadata
