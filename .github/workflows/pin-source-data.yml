name: Pin source data

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to run against (default: main)"
        required: false
        default: ""
  schedule:
    # First Monday of each month at 06:00 UTC
    - cron: "0 6 1-7 * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  pin-source-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.46.0

      - name: Install rclone
        run: curl -sSf https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          rclone config create r2-congeegator s3 \
            provider Cloudflare \
            access_key_id "$R2_ACCESS_KEY_ID" \
            secret_access_key "$R2_SECRET_ACCESS_KEY" \
            endpoint "$R2_ENDPOINT" \
            acl private \
            no_check_bucket true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: Pin source data
        run: pixi run pin-source-data

      - name: Run golden tests
        run: pixi run test

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update pinned source data"
          title: "Update pinned source data"
          body: |
            Automated update of pinned source data from kaikki.org.

            Review golden test diffs and update golden files if needed.
          branch: pin-source-data
          delete-branch: true
