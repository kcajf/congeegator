name: Pin source data

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to run against (default: main)"
        required: false
        default: ""
      languages:
        description: "Optional space-separated language codes; leave empty for a full refresh"
        required: false
        default: ""
      version:
        description: "Optional immutable snapshot timestamp (YYYY-MM-DDTHHMMSSZ)"
        required: false
        default: ""
      source_sha256:
        description: "Optional SHA256 of the compressed source reviewed locally"
        required: false
        default: ""
      publish_only:
        description: "Publish reviewed source files only, without generation or a refresh PR"
        type: boolean
        default: false
  schedule:
    # First Monday of each month at 06:00 UTC
    - cron: "0 6 1-7 * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  pin-source-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.46.0

      - name: Install rclone
        run: sudo apt-get install -y -qq rclone

      - name: Configure rclone
        run: |
          rclone config create r2-congeegator s3 \
            provider Cloudflare \
            access_key_id "$R2_ACCESS_KEY_ID" \
            secret_access_key "$R2_SECRET_ACCESS_KEY" \
            endpoint "$R2_ENDPOINT" \
            acl private \
            no_check_bucket true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: Pin source data
        env:
          PIN_LANGUAGES: ${{ inputs.languages }}
          PIN_VERSION: ${{ inputs.version }}
          PIN_SOURCE_SHA256: ${{ inputs.source_sha256 }}
          PIN_PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          args=()
          if [[ -n "$PIN_LANGUAGES" ]]; then
            read -r -a languages <<< "$PIN_LANGUAGES"
            args+=(--languages "${languages[@]}")
          fi
          if [[ -n "$PIN_VERSION" ]]; then args+=(--version "$PIN_VERSION"); fi
          if [[ -n "$PIN_SOURCE_SHA256" ]]; then args+=(--source-sha256 "$PIN_SOURCE_SHA256"); fi
          if [[ "$PIN_PUBLISH_ONLY" == "true" ]]; then args+=(--no-regenerate); fi
          pixi run pin-source-data "${args[@]}"

      - name: Run golden tests
        if: ${{ !inputs.publish_only }}
        run: pixi run test

      - name: Audit refreshed dictionary forms
        if: ${{ !inputs.publish_only }}
        env:
          AUDIT_LANGUAGES: ${{ inputs.languages }}
        run: |
          args=()
          if [[ -n "$AUDIT_LANGUAGES" ]]; then
            read -r -a languages <<< "$AUDIT_LANGUAGES"
            args+=(--languages "${languages[@]}")
          fi
          pixi run python -m pipeline.audit_forms --source-root cache --workers 4 --output output/forms-quality "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish_only }}
        with:
          name: dictionary-forms-quality
          path: output/forms-quality/
          if-no-files-found: error

      - name: Check source pinning
        if: ${{ inputs.publish_only }}
        run: pixi run pytest pipeline/tests/test_source_pinning.py

      - name: Create pull request
        if: ${{ !inputs.publish_only }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update pinned source data"
          title: "Update pinned source data"
          body: |
            Automated update of pinned source data from kaikki.org.

            Review golden test diffs and the dictionary-forms-quality audit artifact (unknown tags, omission reasons, and forms-per-entry distributions). Update reviewed baselines only after checking the changes.
          branch: pin-source-data
          delete-branch: true
          add-paths: |
            pipeline/cache.py
            apps/*/src/lib/data-manifest.json
            pipeline/tests/golden/
